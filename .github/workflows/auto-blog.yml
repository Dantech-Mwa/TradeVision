name: Auto-Generate Daily Analysis (50+ Assets)

on:
  schedule:
    - cron: '*/30 * * * *'   # Every 30 minutes
    - cron: '0 0 * * *'      # Also run at midnight to reset
  workflow_dispatch:          # Manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15       # 50 assets take ~5-8 minutes
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests matplotlib pandas
      
      - name: Generate 50+ asset analyses
        run: |
          python auto-blog-generator.py
      
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pillar-guides/technical-analysis/daily-analysis/
          git commit -m "Auto-generated analysis for $(date +'%Y-%m-%d %H:%M') - 50+ assets" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
