<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeVision Pro – Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --green: #26a69a;
      --red: #ef5350;
      --border: #30363d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
    .hidden { display: none !important; }
    .container { max-width: 1200px; margin: auto; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    h1 { color: var(--accent); margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center; }
    .stat-value { font-size: 2rem; font-weight: 700; color: var(--accent); }
    .stat-label { color: var(--muted); font-size: 0.8rem; }
    .btn { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-sm { padding: 4px 10px; font-size: 0.8rem; }
    .btn-danger { background: var(--red); }
    .btn-success { background: var(--green); }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); }
    .status { padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: 600; }
    .free { background: rgba(88,166,255,0.1); color: var(--accent); }
    .pro { background: rgba(38,166,154,0.1); color: var(--green); }
    .ultimate { background: rgba(255,215,0,0.1); color: gold; }
    .chart-container { height: 300px; margin-top: 10px; }
    .login-box { max-width: 400px; margin: 100px auto; }
  </style>
</head>
<body>
  <div id="login-section" class="login-box card hidden">
    <h2>Admin Login</h2>
    <p style="color:var(--muted);">Sign in with your Google account to access the dashboard.</p>
    <button id="google-login-btn" class="btn" style="width:100%; margin-top:16px;">Sign in with Google</button>
    <p id="login-error" style="color:var(--red); margin-top:10px; display:none;"></p>
  </div>

  <div id="dashboard" class="container hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h1>Admin Dashboard</h1>
      <button id="logout-btn" class="btn btn-danger btn-sm">Logout</button>
    </div>

    <!-- Stats Cards -->
    <div class="stats-grid" id="stats-cards">
      <div class="stat-card"><div class="stat-value" id="total-users">-</div><div class="stat-label">Total Users</div></div>
      <div class="stat-card"><div class="stat-value" id="active-subs">-</div><div class="stat-label">Active Subscriptions</div></div>
      <div class="stat-card"><div class="stat-value" id="today-views">-</div><div class="stat-label">Today Page Views</div></div>
      <div class="stat-card"><div class="stat-value" id="total-revenue">-</div><div class="stat-label">Total Revenue (approx)</div></div>
    </div>

    <!-- Charts -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px;">
      <div class="card"><h3>Revenue (Last 30 Days)</h3><div class="chart-container"><canvas id="revenue-chart"></canvas></div></div>
      <div class="card"><h3>Page Views (Last 30 Days)</h3><div class="chart-container"><canvas id="views-chart"></canvas></div></div>
    </div>

    <!-- User Management -->
    <div class="card">
      <h3>User Management</h3>
      <div style="overflow-x:auto;">
        <table id="users-table">
          <thead><tr><th>Email</th><th>Display Name</th><th>Subscription</th><th>Actions</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Firebase SDK (same config as main app) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    // Use Realtime Database
    import { getDatabase, ref, get, update, set, child } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDbpC4YUsnM1rbdB4adutnCaJX8OblexS4",
      authDomain: "tradevisionpro-25888.firebaseapp.com",
      databaseURL: "https://tradevisionpro-25888-default-rtdb.firebaseio.com",
      projectId: "tradevisionpro-25888",
      storageBucket: "tradevisionpro-25888.firebasestorage.app",
      messagingSenderId: "542979547209",
      appId: "1:542979547209:web:629a2773daba203c771f98"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // UI elements
    const loginSection = document.getElementById('login-section');
    const dashboard = document.getElementById('dashboard');
    const googleLoginBtn = document.getElementById('google-login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const loginError = document.getElementById('login-error');

    let currentUser = null;

    // Check admin status (reads uids string from RTDB, splits by comma)
    async function isAdmin(uid) {
      const snap = await get(ref(db, 'admin/admins'));
      if (!snap.exists()) return false;
      const data = snap.val();
      const uidsStr = data.uids || '';
      const uids = uidsStr.split(',').map(s => s.trim());
      return uids.includes(uid);
    }

    // Show dashboard
    async function showDashboard() {
      loginSection.classList.add('hidden');
      dashboard.classList.remove('hidden');
      await Promise.all([
        loadStats(),
        loadUsers(),
        loadRevenueChart(),
        loadViewsChart()
      ]);
    }

    // Stats
    async function loadStats() {
      // Total users
      const usersSnap = await get(ref(db, 'users'));
      let totalUsers = 0;
      let activeSubs = 0;
      if (usersSnap.exists()) {
        const users = usersSnap.val();
        totalUsers = Object.keys(users).length;
        for (const uid in users) {
          if (users[uid]?.subscription && users[uid].subscription !== 'free') activeSubs++;
        }
      }
      document.getElementById('total-users').textContent = totalUsers;
      document.getElementById('active-subs').textContent = activeSubs;

      // Today page views
      const today = new Date().toISOString().slice(0,10);
      const viewsSnap = await get(ref(db, 'analytics/' + today + '/pageViews'));
      const todayViews = viewsSnap.exists() ? viewsSnap.val() : 0;
      document.getElementById('today-views').textContent = todayViews;

      // Revenue – sum all payments in RTDB
      const paymentsSnap = await get(ref(db, 'payments'));
      let totalRevenue = 0;
      if (paymentsSnap.exists()) {
        const payments = paymentsSnap.val();
        for (const key in payments) {
          totalRevenue += payments[key].amount || 0;
        }
      }
      document.getElementById('total-revenue').textContent = '$' + totalRevenue.toFixed(2);
    }

    // Revenue chart (last 30 days)
    async function loadRevenueChart() {
      const paySnap = await get(ref(db, 'payments'));
      const dailyRevenue = {};
      if (paySnap.exists()) {
        const payments = paySnap.val();
        for (const key in payments) {
          const p = payments[key];
          if (p.timestamp) {
            const day = new Date(p.timestamp).toISOString().slice(0,10);
            dailyRevenue[day] = (dailyRevenue[day] || 0) + (p.amount || 0);
          }
        }
      }
      const end = new Date();
      const start = new Date(end);
      start.setDate(start.getDate() - 30);
      const labels = [];
      const data = [];
      for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
        const key = d.toISOString().slice(0,10);
        labels.push(key);
        data.push(dailyRevenue[key] || 0);
      }
      new Chart(document.getElementById('revenue-chart'), {
        type: 'line',
        data: { labels, datasets: [{ label: 'Revenue ($)', data, borderColor: '#58a6ff', backgroundColor: 'rgba(88,166,255,0.1)', fill: true, tension: 0.3 }] },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    // Page views chart (last 30 days)
    async function loadViewsChart() {
      const daily = {};
      for (let i = 0; i < 30; i++) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = d.toISOString().slice(0,10);
        const snap = await get(ref(db, 'analytics/' + key + '/pageViews'));
        daily[key] = snap.exists() ? snap.val() : 0;
      }
      const end = new Date();
      const start = new Date(end);
      start.setDate(start.getDate() - 30);
      const labels = [];
      const data = [];
      for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
        const key = d.toISOString().slice(0,10);
        labels.push(key);
        data.push(daily[key] || 0);
      }
      new Chart(document.getElementById('views-chart'), {
        type: 'bar',
        data: { labels, datasets: [{ label: 'Page Views', data, backgroundColor: '#26a69a' }] },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    // User table
    async function loadUsers() {
      const tbody = document.querySelector('#users-table tbody');
      tbody.innerHTML = '';
      const snap = await get(ref(db, 'users'));
      if (!snap.exists()) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--muted);">No users found yet.</td></tr>';
        return;
      }
      const users = snap.val();
      for (const uid in users) {
        const user = users[uid];
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${user.email || 'N/A'}</td>
          <td>${user.displayName || '-'}</td>
          <td><span class="status ${user.subscription || 'free'}">${user.subscription || 'free'}</span></td>
          <td>
            <button class="btn btn-sm btn-success grant-ultimate" data-uid="${uid}">Grant Ultimate</button>
            <button class="btn btn-sm btn-danger revoke-ultimate" data-uid="${uid}">Revoke</button>
          </td>
        `;
        tbody.appendChild(row);
      }

      // Grant / Revoke
      document.querySelectorAll('.grant-ultimate').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const uid = e.target.dataset.uid;
          await update(ref(db, 'users/' + uid), { subscription: 'ultimate' });
          alert('User upgraded to Ultimate!');
          loadUsers();
          loadStats();
        });
      });
      document.querySelectorAll('.revoke-ultimate').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const uid = e.target.dataset.uid;
          await update(ref(db, 'users/' + uid), { subscription: 'free' });
          alert('Subscription revoked.');
          loadUsers();
          loadStats();
        });
      });
    }

    // Auth
    googleLoginBtn.addEventListener('click', async () => {
      try {
        const provider = new GoogleAuthProvider();
        const result = await signInWithPopup(auth, provider);
        currentUser = result.user;
        if (await isAdmin(currentUser.uid)) {
          showDashboard();
        } else {
          loginError.style.display = 'block';
          loginError.textContent = 'You are not authorized to view this page.';
          await signOut(auth);
        }
      } catch (e) {
        loginError.style.display = 'block';
        loginError.textContent = e.message;
      }
    });

    logoutBtn.addEventListener('click', async () => {
      await signOut(auth);
      dashboard.classList.add('hidden');
      loginSection.classList.remove('hidden');
    });

    onAuthStateChanged(auth, async user => {
      if (user) {
        currentUser = user;
        if (await isAdmin(user.uid)) {
          showDashboard();
        } else {
          loginSection.classList.remove('hidden');
          loginError.style.display = 'block';
          loginError.textContent = 'You are not an admin.';
          await signOut(auth);
        }
      } else {
        loginSection.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
