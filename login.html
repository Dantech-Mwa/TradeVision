<!DOCTYPE html>
<html lang="en">

  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
      --border: #334155; --input-bg: #0f172a; --primary: #0d6efd;
    }
    [data-theme="light"] {
      --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --muted: #64748b;
      --border: #e2e8f0; --input-bg: #f1f5f9;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background 0.3s;
    }
    .container {
      background: var(--card);
      padding: 44px 50px;
      border-radius: 18px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
      max-width: 480px;
      width: 100%;
      border: 1px solid var(--border);
      position: relative;
    }
    .theme-toggle {
      position: absolute; top: 20px; right: 20px;
      background: none; border: none; font-size: 26px; cursor: pointer; opacity: 0.7;
    }
    .logo h1 { font-size: 34px; font-weight: 700; text-align: center; margin-bottom: 8px; }
    .logo p { text-align: center; color: var(--muted); font-size: 15px; margin-bottom: 32px; }
    h2 { text-align: center; margin: 20px 0 32px; font-weight: 600; font-size: 24px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 9px; font-weight: 500; }
    input, select {
      width: 100%; padding: 15px 16px; border: 1px solid var(--border);
      background: var(--input-bg); border-radius: 10px; color: var(--text);
      font-size: 16px; transition: border 0.2s;
    }
    input:focus, select:focus { outline: none; border-color: var(--primary); }
    button {
      width: 100%; padding: 15px; background: var(--primary); color: white;
      border: none; border-radius: 10px; font-weight: 600; font-size: 17px;
      cursor: pointer; margin-top: 12px; transition: 0.2s;
    }
    button:hover { background: #0b5ed7; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .error { color: #fca5a5; text-align: center; margin-top: 12px; font-size: 14px; }
    .success { color: #86efac; text-align: center; margin-top: 12px; font-size: 14px; }
    .toggle-link { text-align: center; margin-top: 28px; color: var(--muted); font-size: 15px; }
    .toggle-link a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .forgot-link { text-align: center; margin-top: 16px; }
    .forgot-link a { color: var(--primary); font-size: 14px; text-decoration: none; }
  </style>
</head>
<body>

<div class="container">
  <button class="theme-toggle" id="themeToggle">Dark Mode</button>

  <div class="logo">
    <h1>Tradevision Prochart</h1>
    <p>Professional Trading Intelligence Platform</p>
  </div>

  <!-- Login Form -->
  <div id="loginForm">
    <h2>Sign In</h2>
    <div class="form-group"><label>Email Address</label><input type="email" id="loginEmail" required /></div>
    <div class="form-group"><label>Password</label><input type="password" id="loginPassword" required /></div>
    <button id="loginBtn">Sign In</button>
    <div id="loginMessage"></div>
    <div class="forgot-link">
      <a href="#" id="showForgot">Forgot password?</a>
    </div>
    <div class="toggle-link">
      Don't have an account? <a href="#" id="showRegister">Create one</a>
    </div>
  </div>

  <!-- Register Form -->
  <div id="registerForm" style="display:none;">
    <h2>Create Account</h2>
    <div class="form-group"><label>Full Name</label><input type="text" id="regName" required /></div>
    <div class="form-group"><label>Email Address</label><input type="email" id="regEmail" required /></div>
    <div class="form-group"><label>Password (min. 8 characters)</label><input type="password" id="regPassword" required /></div>
    <div class="form-group"><label>Phone Number (optional)</label><input type="tel" id="regPhone" /></div>
    <div class="form-group"><label>Country *</label><select id="regCountry" required></select></div>
    <div class="form-group"><label>City / Region</label><input type="text" id="regCity" required /></div>
    <div class="form-group"><label>Street Address (optional)</label><input type="text" id="regAddress" /></div>
    <button id="registerBtn">Create Account</button>
    <div id="regMessage"></div>
    <div class="toggle-link">
      Already have an account? <a href="#" id="showLogin">Sign In</a>
    </div>
  </div>

  <!-- Forgot Password Form -->
  <div id="forgotForm" style="display:none;">
    <h2>Reset Password</h2>
    <p style="text-align:center; color:var(--muted); margin-bottom:24px;">
      Enter your email and we'll send you a link to reset your password.
    </p>
    <div class="form-group"><label>Email Address</label><input type="email" id="forgotEmail" required /></div>
    <button id="resetBtn">Send Reset Link</button>
    <div id="forgotMessage"></div>
    <div class="toggle-link">
      <a href="#" id="backToLogin">Back to Sign In</a>
    </div>
  </div>
</div>

  countries.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.code; opt.textContent = c.name;
    document.getElementById('regCountry').appendChild(opt);
  });

  // Form Navigation
  const showForm = (id) => {
    document.getElementById('loginForm').style.display = id === 'loginForm' ? 'block' : 'none';
    document.getElementById('registerForm').style.display = id === 'registerForm' ? 'block' : 'none';
    document.getElementById('forgotForm').style.display = id === 'forgotForm' ? 'block' : 'none';
  };
  document.getElementById('showRegister').onclick = e => { e.preventDefault(); showForm('registerForm'); };
  document.getElementById('showLogin').onclick = e => { e.preventDefault(); showForm('loginForm'); };
  document.getElementById('showForgot').onclick = e => { e.preventDefault(); showForm('forgotForm'); };
  document.getElementById('backToLogin').onclick = e => { e.preventDefault(); showFormForm('loginForm'); };

  // Register
  document.getElementById('registerBtn').onclick = async () => {
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const phone = document.getElementById('regPhone').value.trim();
    const countryCode = document.getElementById('regCountry').value;
    const countryName = document.getElementById('regCountry').selectedOptions[0].text;
    const city = document.getElementById('regCity').value.trim();
    const address = document.getElementById('regAddress').value.trim();

    if (!name || !email || !password || !countryCode || !city || password.length < 8) {
      document.getElementById('regMessage').innerHTML = '<p class="error">All required fields & password ≥8 characters</p>';
      return;
    }

    document.getElementById('registerBtn').disabled = true;
    document.getElementById('regMessage').innerHTML = '<p>Creating account...</p>';

    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await set(ref(db, 'users/' + cred.user.uid), {
        uid: cred.user.uid, name, email, phone: phone || null,
        country: { code: countryCode, name: countryName },
        city, address: address || null,
        createdAt: Date.now(), lastLogin: Date.now(),
        role: "trader", status: "active"
      });
      document.getElementById('regMessage').innerHTML = '<p class="success">Account created! Redirecting...</p>';
      setTimeout(() => location.href = "https://tradevisionpro.online/dashboard.html", 1500);
    } catch (err) {
      document.getElementById('regMessage').innerHTML = `<p class="error">${err.message}</p>`;
      document.getElementById('registerBtn').disabled = false;
    }
  };

    const password = document.getElementById('loginPassword').value;
    if (!email || !password) return document.getElementById('loginMessage').innerHTML = '<p class="error">Enter email & password</p>';

    document.getElementById('loginBtn').disabled = true;
    document.getElementById('loginMessage').innerHTML = '<p>Signing in...</p>';

    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      await update(ref(db, 'users/' + cred.user.uid), { lastLogin: Date.now() });
      setTimeout(() => location.href = "https://tradevisionpro.online/dashboard.html", 800);
    } catch (err) {
      document.getElementById('loginMessage').innerHTML = `<p class="error">${err.message}</p>`;
      document.getElementById('loginBtn').disabled = false;
    }
  };

  document.getElementById('resetBtn').onclick = async () => {
    const email = document.getElementById('forgotEmail').value.trim();
    if (!email) return document.getElementById('forgotMessage').innerHTML = '<p class="error">Enter your email address</p>';

    document.getElementById('resetBtn').disabled = true;
    document.getElementById('forgotMessage').innerHTML = '<p>Sending reset link...</p>';

    try {
      await sendPasswordResetEmail(auth, email);
      document.getElementById('forgotMessage').innerHTML = '<p class="success">Password reset email sent! Check your inbox.</p>';
    } catch (err) {
      document.getElementById('forgotMessage').innerHTML = `<p class="error">${err.message}</p>`;
      document.getElementById('resetBtn').disabled = false;
    }
  };
</script>
</body>
</html>
